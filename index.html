<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal details form</title>
    <link rel="stylesheet" href="form/style.css">
</head>
<body>
    <h1 class="form-title">Let's get to know you</h1>
    <div class="form-container">
        <form id="informationForm">
            <div class="form-grp">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="your name" required>
            </div>
            <div class="form-grp">
                <label for="surname">Surname:</label>
                <input type="text" id="surname" name="surname" placeholder="your surname" required>
            </div>
            <div class="form-grp">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="yourEmail@gmail.com" required>
            </div>
            <div class="form-grp">
                <label for="color">Favorite color:</label>
                <select id="color" name="color" required>
                    <option value="">Select a color</option>
                    <option value="Blue" data-color="blue">Blue</option>
                    <option value="Green" data-color="green">Green</option>
                    <option value="Orange" data-color="orange">Orange</option>
                    <option value="Purple" data-color="purple">Purple</option>
                    <option value="Red" data-color="red">Red</option>
                    <option value="Yellow" data-color="yellow">Yellow</option>
                    <option value="Pink" data-color="pink">Pink</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">Submit</button>
                
        </form>
    </div>
    <script src="form/script.js"></script>
</body>
</html>
